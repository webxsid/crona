name: Nix

on:
  push:
    branches: [main]
    paths: [flake.nix, flake.lock, nix/**, go.mod, go.sum]
  pull_request:
    paths: [flake.nix, flake.lock, nix/**, go.mod, go.sum]
  workflow_dispatch:

jobs:
  build:
    name: Build flake packages
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check and build crona and crona-beta
        run: |
          set -eu
          nix flake check --all-systems
          for package in crona crona-beta crona-git; do
            nix build ".#${package}" --print-build-logs
            ./result/bin/crona --version
            test -x ./result/bin/crona-daemon
            test -x ./result/bin/crona-tui
          done
