name: Homebrew Test

on:
  pull_request:
  workflow_dispatch:

jobs:
  brew-test:
    name: Isolated Homebrew Validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            shared/go.sum
            kernel/go.sum
            tui/go.sum
            cli/go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          install-only: true

      # Linux runners ship Homebrew under /home/linuxbrew but leave it off the PATH.
      - name: Put Homebrew on the PATH
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"

      - name: Run isolated Homebrew workflow
        run: make brew-test
